<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flores.ia</title>
    <style>
        :root {
            --bg-color: #212121;
            --chat-bg: #212121;
            --input-bg: #2f2f2f;
            --text-color: #ececec;
            --btn-black: #121212;
            --btn-border: #383838;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            position: relative;
        }

        .chat-header {
            padding: 16px;
            text-align: center;
            font-weight: 600;
            font-size: 1.1rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 18px;
            line-height: 1.5;
            font-size: 0.95rem;
            word-wrap: break-word;
        }

        .user-message {
            background-color: #2f2f2f;
            color: #fff;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .ai-message {
            background-color: transparent;
            color: var(--text-color);
            align-self: flex-start;
        }

        .input-container {
            padding: 12px 16px 24px 16px;
            background-color: var(--bg-color);
        }

        .input-box {
            background-color: var(--input-bg);
            border-radius: 26px;
            display: flex;
            align-items: center;
            padding: 8px 12px 8px 16px;
            gap: 10px;
            max-width: 800px;
            margin: 0 auto;
        }

        .input-box textarea {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-color);
            font-size: 16px;
            resize: none;
            max-height: 120px;
            height: 24px;
        }

        .action-btn {
            background: transparent;
            border: none;
            color: #b4b4b4;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 6px;
            border-radius: 50%;
        }

        /* Botón de enviar en negro mate con la flecha blanca */
        .send-btn {
            background-color: var(--btn-black) !important;
            color: #ffffff !important;
            border: 1px solid var(--btn-border) !important;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            transition: background-color 0.2s;
        }

        .send-btn:active {
            background-color: #2a2a2a !important;
        }

        .send-btn svg {
            width: 20px;
            height: 20px;
            stroke: #ffffff;
            stroke-width: 2.5;
            fill: none;
        }

        .mic-btn svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="chat-header">
            Flores.ia
        </div>

        <div class="chat-box" id="chatBox">
            <div class="message ai-message">¡Hola! Soy Flores.ia. ¿En qué te puedo ayudar hoy?</div>
        </div>

        <div class="input-container">
            <div class="input-box">
                <textarea id="userInput" placeholder="Escribe un mensaje..." rows="1"></textarea>
                
                <!-- Botón de Micrófono -->
                <button class="action-btn mic-btn" id="micBtn" title="Activar micrófono">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
                        <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
                    </svg>
                </button>

                <!-- Botón de Enviar en Negro Mate con Flecha -->
                <button class="send-btn" id="sendBtn" title="Enviar">
                    <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="19" x2="12" y2="5"></line>
                        <polyline points="5 12 12 5 19 12"></polyline>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        // 🔑 PEGA TU API KEY DE GEMINI AQUÍ ENTRE LAS COMILLAS
        const API_KEY = 'curl "https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent" \
  -H 'Content-Type: application/json' \
  -H 'X-goog-api-key: AQ.Ab8RN6LGSRwFWmEYU6ViGp1U3Bc0Rca-NfOCHgWWk_ZgnrymXw' \
  -X POST \
  -d '{
    "contents": [
      {
        "parts": [
          {
            "text": "Explain how AI works in a few words"
          }
        ]
      }
    ]
  }'';

        const chatBox = document.getElementById('chatBox');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');

        async function handleSendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            // Mostrar mensaje del usuario
            appendMessage(text, 'user-message');
            userInput.value = '';
            userInput.style.height = '24px';

            // Mensaje temporal de "escribiendo..."
            const loadingId = appendMessage('Pensando...', 'ai-message');

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: text }] }]
                    })
                });

                const data = await response.json();
                const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || 'No pude obtener una respuesta.';

                // Reemplazar texto de carga por la respuesta real
                document.getElementById(loadingId).innerText = reply;
            } catch (error) {
                document.getElementById(loadingId).innerText = 'Ocurrió un error al conectar con la IA.';
            }

            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function appendMessage(text, className) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${className}`;
            const id = 'msg_' + Date.now();
            messageDiv.id = id;
            messageDiv.innerText = text;
            chatBox.appendChild(messageDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
            return id;
        }

        sendBtn.addEventListener('click', handleSendMessage);
        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                handleSendMessage();
            }
        });
    </script>
</body>
</html>
