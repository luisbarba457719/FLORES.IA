<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flores.ia</title>
    <style>
        :root {
            --bg-color: #212121;
            --sidebar-bg: #171717;
            --chat-bg: #212121;
            --input-bg: #2f2f2f;
            --text-color: #ececec;
            --btn-black: #121212;
            --btn-border: #383838;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            position: relative;
        }

        .chat-header {
            padding: 16px;
            text-align: center;
            font-weight: 600;
            font-size: 1.1rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .input-container {
            padding: 12px 16px 24px 16px;
            background-color: var(--bg-color);
        }

        .input-box {
            background-color: var(--input-bg);
            border-radius: 26px;
            display: flex;
            align-items: center;
            padding: 8px 12px 8px 16px;
            gap: 10px;
            max-width: 800px;
            margin: 0 auto;
        }

        .input-box textarea {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-color);
            font-size: 16px;
            resize: none;
            max-height: 120px;
            height: 24px;
        }

        .action-btn {
            background: transparent;
            border: none;
            color: #b4b4b4;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 6px;
            border-radius: 50%;
        }

        /* Botón de enviar en negro mate con la flecha blanca */
        .send-btn {
            background-color: var(--btn-black) !important;
            color: #ffffff !important;
            border: 1px solid var(--btn-border) !important;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            transition: background-color 0.2s;
        }

        .send-btn:active {
            background-color: #2a2a2a !important;
        }

        .send-btn svg {
            width: 20px;
            height: 20px;
            stroke: #ffffff;
            stroke-width: 2.5;
            fill: none;
        }

        .mic-btn svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="chat-header">
            Flores.ia
        </div>

        <div class="chat-box" id="chatBox">
            <!-- Los mensajes del chat aparecerán aquí -->
        </div>

        <div class="input-container">
            <div class="input-box">
                <textarea id="userInput" placeholder="Escribe un mensaje..." rows="1"></textarea>
                
                <!-- Botón de Micrófono -->
                <button class="action-btn mic-btn" title="Activar micrófono">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
                        <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
                    </svg>
                </button>

                <!-- Botón de Enviar en Negro Mate con Flecha -->
                <button class="send-btn" id="sendBtn" title="Enviar">
                    <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="19" x2="12" y2="5"></line>
                        <polyline points="5 12 12 5 19 12"></polyline>
                    </svg>
                </button>
            </div>
        </div>
    </div>

</body>
</html>
